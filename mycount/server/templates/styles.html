<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #191410; color: #f3e7db; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #ffac63; text-underline-offset: .2em; }
  .masthead { padding: 1.2rem 2rem; background: #291d15; border-bottom: 1px solid #62412b; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .masthead-title > a { font-size: 1.3rem; font-weight: 700; text-decoration: none; }
  .masthead-title p { margin: .35rem 0 0; font-size: .85rem; color: #d8b89d; }
  .masthead span { color: #d8b89d; }
  .masthead nav { display: flex; align-items: center; gap: 1rem; }
  nav [aria-current="page"] { font-weight: 700; color: #f3e7db; }
  .refresh-row { padding: .65rem 2rem; text-align: right; border-bottom: 1px solid #62412b; }
  .last-refresh { font-size: .85rem; color: #d8b89d; }
  .column-sort { font: inherit; font-weight: 700; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; width: 100%; }
  .column-sort::after { content: ' ↕'; color: #d8b89d; }
  th[aria-sort="ascending"] .column-sort::after { content: ' ↑'; }
  th[aria-sort="descending"] .column-sort::after { content: ' ↓'; }
  .metrics-tables { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; align-items: start; }
  .metrics-site-column, .metrics-location-column { min-width: 0; display: grid; gap: 1.5rem; }
  .country-chart, .traffic-chart, .site-chart { min-width: 0; border: 1px solid #62412b; border-radius: .4rem; overflow: hidden; }
  .country-chart h2, .traffic-chart h2, .site-chart h2 { margin: 0; padding: .8rem; font-size: .9rem; background: #291d15; }
  .metrics-charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 1.5rem; margin-top: 1.5rem; }
  .site-chart-content { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .75rem; align-items: center; height: 220px; padding: .75rem; }
  #site-pie { width: 100%; height: 190px; }
  .site-legend { max-height: 190px; overflow-y: auto; }
  .site-legend li { grid-template-columns: .8rem minmax(0, 1fr); white-space: nowrap; }
  #all-traffic { width: 100%; height: 220px; }
  .country-chart-content { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem; padding: 1.25rem; }
  .country-pie { width: 15rem; max-width: 100%; height: 15rem; flex-shrink: 0; margin-inline: auto; }
  .country-legend { flex: 1 1 14rem; min-width: 0; list-style: none; margin: 0; padding: 0; font-size: .9rem; }
  .country-legend li { display: grid; grid-template-columns: .8rem minmax(0, 1fr) auto; align-items: baseline; gap: .6rem; padding: .4rem 0; overflow-wrap: anywhere; }
  .country-swatch { width: .8rem; height: .8rem; border-radius: .15rem; }
  .country-value { text-align: right; white-space: nowrap; }
  .country-chart > p, .traffic-chart > p, .site-chart > p { margin: 1.25rem; font-size: .9rem; }
  .metrics-filters fieldset { margin: 0; min-width: 0; padding: 1rem; border: 1px solid #62412b; border-radius: .4rem; }
  .metrics-filters legend { font-weight: 700; }
  .metrics-filters label, .metrics-filters input { cursor: pointer; }
  caption { padding: .8rem; font-weight: 700; text-align: left; background: #291d15; }
  @media (max-width: 1000px) { .metrics-tables { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .metrics-charts { grid-template-columns: 1fr; } }
  .table-wrap { overflow-x: auto; border: 1px solid #62412b; border-radius: .4rem; }
  .table-scroll { overflow-y: auto; scrollbar-gutter: stable; }
  table { border-collapse: collapse; width: 100%; text-align: left; font-size: .9rem; }
  th, td { padding: .8rem; border-bottom: 1px solid #62412b; }
  th { background: #291d15; }
  td:first-child { overflow-wrap: anywhere; }
  tr:last-child td { border-bottom: 0; }
  tfoot th, tfoot td { font-weight: 700; text-align: right; background: #291d15; border-top: 1px solid #62412b; border-bottom: 0; }
  .visits { text-align: right; }
  .site-row { cursor: pointer; }
  .site-row:hover { background: #291d15; }
  .site-toggle { font: inherit; color: #ffac63; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
  .site-pages > td { padding: 1rem 1rem 1rem 2rem; background: #211912; }
  .site-pages table { table-layout: fixed; }
  .site-pages th:first-child { width: 60%; }
  .recent-visits td:last-child { overflow-wrap: anywhere; }
  time { white-space: nowrap; }
  main { padding: 1rem 2rem 3rem; }
  :focus-visible { outline: 2px solid #ffac63; outline-offset: 3px; }
  @media (max-width: 600px) { main, .masthead, .refresh-row { padding: 1rem; } }
</style>
