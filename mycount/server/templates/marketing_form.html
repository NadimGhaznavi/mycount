<script>
  (() => {
    const input = document.getElementById('posted-at');
    const pad = value => String(value).padStart(2, '0');
    if (!input.value) {
      const now = new Date();
      input.value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }
    document.getElementById('marketing-form').addEventListener('submit', event => {
      const parts = input.value.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/);
      if (!parts) return;
      const [year, month, day, hour, minute] = parts.slice(1).map(Number);
      const date = new Date(year, month - 1, day, hour, minute);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day || date.getHours() !== hour || date.getMinutes() !== minute) {
        event.preventDefault();
        input.setCustomValidity('Enter a valid local date and time.');
        input.reportValidity();
        return;
      }
      document.getElementById('timezone-offset').value = date.getTimezoneOffset();
    });
    input.addEventListener('input', () => input.setCustomValidity(''));
  })();
</script>
