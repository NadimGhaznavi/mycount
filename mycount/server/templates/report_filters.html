<form class="metrics-filters" method="get">
  <fieldset>
    <legend>Report filters</legend>
    <label>From <input type="date" name="start" value="{{ options.start.isoformat() }}" required></label>
    <label>Through <input type="date" name="end" value="{{ options.end.isoformat() }}" required></label>
    <input type="hidden" name="timezone" value="{{ options.timezone }}">
    <input type="hidden" name="exclude_bots" value="0">
    <label><input type="checkbox" name="exclude_bots" value="1"{% if exclude_bots %} checked{% endif %}> Exclude bots</label>
    <button type="submit">Apply filters</button>
  </fieldset>
</form>
<script>
  (() => {
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    document.querySelector('.metrics-filters input[name="timezone"]').value = timezone;
    {% if not error %}
    const url = new URL(window.location.href);
    if (url.searchParams.get('timezone') !== timezone) {
      url.searchParams.set('timezone', timezone);
      window.location.replace(url.href);
    }
    {% endif %}
  })();
</script>
